<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f0">
  <title>우리집 냉장고</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap brand">우리집 냉장고 <time id="today"></time><button id="logout" type="button" hidden>로그아웃</button></div>
  </header>
  <section class="wrap auth" id="auth" hidden>
    <div class="auth-card">
      <h1 id="auth-title">로그인</h1>
      <form id="auth-form" aria-labelledby="auth-title">
        <label>이메일 <input name="email" type="email" autocomplete="username" maxlength="254" required></label>
        <label>비밀번호 <input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
        <p id="auth-error" role="alert" hidden></p>
        <button type="submit" class="primary">로그인</button>
      </form>
      <button type="button" id="switch-auth">회원가입</button>
    </div>
  </section>
  <main class="wrap" id="fridge" hidden>
    <div class="intro">
      <div><h1>우리집 냉장고</h1><p id="subtitle">식재료와 소비기한을 한눈에 관리하세요.</p></div>
      <button type="button" class="primary" id="add">＋ 식재료 등록</button>
    </div>
    <p id="notice" role="status" hidden></p>
    <section class="priority" aria-labelledby="priority-title">
      <h2 id="priority-title">오늘 먼저 먹을 식재료</h2>
      <div id="priority"></div>
    </section>
    <section class="inventory" aria-labelledby="inventory-title">
      <div class="inventory-heading">
        <h2 id="inventory-title">식재료 목록</h2>
        <span id="count" role="status"></span>
        <button type="button" id="reset-filters">초기화</button>
      </div>
      <label class="inventory-search">식재료 이름 검색
        <input id="item-search" type="search" placeholder="예: 우유" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="filter-groups">
        <fieldset class="filter-group">
          <legend>목록 보기</legend>
          <div class="filters">
            <button type="button" data-view="active" aria-pressed="true">보관 중</button>
            <button type="button" data-view="consumed" aria-pressed="false">소비 완료</button>
            <button type="button" data-view="all" aria-pressed="false">전체</button>
          </div>
        </fieldset>
        <fieldset class="filter-group">
          <legend>보관 장소</legend>
          <div class="filters">
            <button type="button" data-location="냉장" aria-pressed="false">냉장</button>
            <button type="button" data-location="냉동" aria-pressed="false">냉동</button>
            <button type="button" data-location="실온" aria-pressed="false">실온</button>
          </div>
        </fieldset>
        <fieldset class="filter-group">
          <legend>소비기한</legend>
          <div class="filters">
            <button type="button" data-expiry="urgent" aria-pressed="false">3일 이내</button>
            <button type="button" data-expiry="expired" aria-pressed="false">기한 경과</button>
            <button type="button" data-expiry="fresh" aria-pressed="false">4일 이상</button>
          </div>
        </fieldset>
      </div>
      <ul id="items" class="items"></ul>
    </section>
  </main>
  <p class="wrap" id="startup" role="status">서비스에 연결 중이에요.</p>
  <dialog id="editor">
    <form id="item-form">
      <h2 id="form-title">식재료 등록</h2>
      <label>식재료명 <input name="name" required maxlength="60" placeholder="예: 두부"></label>
      <label>수량 <input name="quantity" required maxlength="30" placeholder="예: 1 모"></label>
      <label>보관 장소 <select name="location"><option>냉장</option><option>냉동</option><option>실온</option></select></label>
      <label>소비기한 <input name="expires" type="date" required min="0001-01-01" max="9999-12-31"></label>
      <p id="form-error" role="alert" hidden></p>
      <div class="actions"><button type="button" id="cancel">취소</button><button class="primary" type="submit">저장</button></div>
    </form>
  </dialog>
</body>
</html>
